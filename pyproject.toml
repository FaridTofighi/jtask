[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jtask"
version = "0.1.0"
description = "A full-featured Persian/Jalali shell around Taskwarrior"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Farid Tofighi", email = "tofighi.farid@gmail.com" }]
dependencies = [
    "jdatetime>=5.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "rich>=13.0",
    "plotext>=5.2,<6",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
jtask = "jtask.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jtask"]

[tool.hatch.build.targets.wheel.force-include]
"src/jtask/themes_data" = "jtask/themes_data"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/jtask/fonts.py" = ["E501"]  # copy-pasteable setup snippets

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
