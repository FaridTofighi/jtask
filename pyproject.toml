[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jtask"
version = "0.1.0"
description = "A full-featured Persian/Jalali shell around Taskwarrior"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Farid Tofighi", email = "tofighi.farid@gmail.com" }]
dependencies = [
    "jdatetime>=5.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "rich>=13.0",
    "plotext>=5.2,<6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6", "matplotlib>=3.8", "qtawesome>=1.3"]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.5", "pytest-qt>=4.4"]

[project.scripts]
jtask = "jtask.cli:main"

[project.gui-scripts]
jtask-gui = "jtask_gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jtask", "src/jtask_gui"]

[tool.hatch.build.targets.wheel.force-include]
"src/jtask/themes_data" = "jtask/themes_data"
"src/jtask_gui/resources" = "jtask_gui/resources"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/jtask_gui/resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/jtask/fonts.py" = ["E501"]  # copy-pasteable setup snippets
"src/jtask_gui/**" = ["N802", "N815", "N803", "B008"]  # Qt idioms

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# The framework-agnostic core is type-checked strictly; the PyQt6 GUI layer is
# covered by pytest-qt instead (the Qt6 stubs' pervasive `| None` returns make
# a strict mypy pass mostly noise).
files = ["src/jtask"]

[[tool.mypy.overrides]]
module = "jtask_gui.*"
ignore_errors = true
